[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-visual-odometry"
version = "0.1.0"
description = "Feature-based monocular visual odometry with dynamic-object filtering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "matplotlib>=3.8,<4",
  "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
